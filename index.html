*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--tx);font-family:var(--body);overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
kbd{font-family:var(--body);font-size:.8em;border:1px solid rgba(255,255,255,.25);border-radius:4px;padding:1px 6px;margin:0 2px}

/* ---------- GATE ---------- */
#gate{position:fixed;inset:0;z-index:50;display:grid;place-items:center;overflow:hidden;transition:opacity .8s var(--ease),transform .9s var(--ease)}
#gate .gbg{position:absolute;inset:-5%;background:var(--city) center/cover;filter:blur(2px) brightness(.55);animation:kb 30s ease-in-out infinite alternate}
#gate .gveil{position:absolute;inset:0;background:radial-gradient(ellipse at 75% 90%,rgba(238,106,44,.45),transparent 60%),linear-gradient(120deg,rgba(10,11,17,.95) 30%,rgba(10,11,17,.6))}
#gate .gbox{position:relative;width:min(440px,88vw);text-align:left;animation:rise 1s var(--ease) both}
#gate img{height:44px;margin-bottom:56px;display:block}
#gate .geb{font-size:11px;font-weight:700;letter-spacing:.32em;color:var(--or);display:flex;align-items:center;gap:14px;margin-bottom:14px}
#gate .geb:before{content:"";width:34px;height:2px;background:var(--or)}
#gate h1{text-transform:uppercase;font-family:var(--disp);font-weight:400;font-size:64px;line-height:.92;letter-spacing:.01em;margin-bottom:34px}
#gate h1 em{font-style:normal;color:var(--or)}
#gate form{display:flex;border:1px solid rgba(255,255,255,.18);background:rgba(10,11,17,.55);backdrop-filter:blur(8px);transition:border-color .3s}
#gate form:focus-within{border-color:var(--or)}
#gate input{flex:1;min-width:0;background:none;border:0;outline:0;color:var(--tx);font:500 16px var(--body);padding:18px 20px;letter-spacing:.08em}
#gate input::placeholder{color:var(--mu2);letter-spacing:.2em;font-size:12px;font-weight:600}
#gate form button{width:62px;background:var(--or);display:grid;place-items:center;transition:background .2s}
#gate form button:hover{background:var(--or2)}
#gate form button svg{width:22px;height:22px;transition:transform .3s var(--ease)}
#gate form button:hover svg{transform:translateX(3px)}
#gate .gmsg{min-height:20px;margin-top:14px;font-size:13.5px;font-weight:500;color:var(--mu);letter-spacing:.04em}
#gate .gmsg.err{color:#ff7b6b}
#gate.shake .gbox form{animation:shake .45s}
#gate.out{opacity:0;transform:scale(1.04);pointer-events:none}
#gate .gfoot{position:absolute;left:0;right:0;bottom:28px;text-align:center;font-size:10px;letter-spacing:.2em;color:var(--mu2)}
@keyframes shake{0%,100%{transform:none}20%{transform:translateX(-10px)}40%{transform:translateX(9px)}60%{transform:translateX(-6px)}80%{transform:translateX(4px)}}

/* ---------- STAGE ---------- */
#app{position:fixed;inset:0;opacity:0;transition:opacity .8s .2s}
#app.on{opacity:1}
#viewport{position:absolute;inset:0;display:grid;place-items:center}
#stage{position:relative;width:1600px;height:900px;flex:none;transform-origin:center center}
.slide{position:absolute;inset:0;overflow:hidden;background:var(--bg2);
  background-image:radial-gradient(900px 520px at 100% 0%,rgba(238,106,44,.09),transparent 65%),radial-gradient(700px 500px at 0% 100%,rgba(90,100,160,.06),transparent 70%);
  padding:70px 96px 92px;display:flex;flex-direction:column;
  visibility:hidden;opacity:0;transform:translateX(70px) scale(.985);
  transition:opacity .7s var(--ease),transform .9s var(--ease),visibility 0s .9s,filter .7s;
  filter:blur(4px)}
.slide.past{transform:translateX(-70px) scale(.985)}
.slide.active{visibility:visible;opacity:1;transform:none;filter:none;transition:opacity .7s var(--ease) .12s,transform .9s var(--ease) .08s,visibility 0s,filter .7s .1s;z-index:2}
.slide:before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.035;
  background-image:linear-gradient(rgba(255,255,255,1) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,1) 1px,transparent 1px);background-size:80px 80px;
  -webkit-mask-image:radial-gradient(ellipse at 100% 0%,#000,transparent 60%);mask-image:radial-gradient(ellipse at 100% 0%,#000,transparent 60%)}
.slide>.chrome-logo{position:absolute;top:66px;right:96px;height:36px}
.slide>.chrome-foot{position:absolute;left:96px;right:96px;bottom:34px;display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--line);padding-top:16px;font-size:11px;letter-spacing:.14em;color:var(--mu2)}
.slide>.chrome-foot b{color:var(--or);font-weight:800;letter-spacing:.06em;font-size:13px}

/* reveal animation */
.slide [data-a]{opacity:0}
.slide.active [data-a]{animation:rise .85s var(--ease) both;animation-delay:calc(var(--i,0) * 85ms + 280ms)}
/* click builds: each [data-step] waits for a click, then rises in */
.slide [data-step]{opacity:0}
.slide.active [data-step]:not(.shown){animation:none!important;opacity:0!important;pointer-events:none}
.slide.active [data-step].shown{animation:rise .75s var(--ease) both!important;animation-delay:0s!important}
.slide.active .arr[data-step].shown{animation-name:fadeIn!important}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.slide.active [data-a=left]{animation-name:fromLeft}
.slide.active [data-a=mask]{animation-name:maskUp;animation-duration:1s}
.line{display:block;overflow:hidden;padding-bottom:.02em}
.line>span{display:inline-block}
@keyframes rise{from{opacity:0;transform:translateY(26px)}to{opacity:1;transform:none}}
@keyframes fromLeft{from{opacity:0;transform:translateX(-40px);clip-path:inset(0 100% 0 0)}to{opacity:1;transform:none;clip-path:inset(0 0 0 0)}}
@keyframes maskUp{from{opacity:1;transform:translateY(105%)}to{opacity:1;transform:none}}
@keyframes kb{from{transform:scale(1.04) translate(0,0)}to{transform:scale(1.14) translate(-2%,-2%)}}

/* header */
.sh{position:relative;z-index:1;max-width:1200px}
.kicker,.lbl{font-size:11.5px;font-weight:800;letter-spacing:.28em;color:var(--or)}
.sh .kicker{margin-bottom:10px}
.sh h2{font-family:var(--disp);font-weight:400;font-size:62px;line-height:.95;letter-spacing:.01em;text-transform:uppercase}
.sh .sub{font-size:19px;color:var(--mu);font-weight:300;margin-top:10px}
.sh .rule{width:64px;height:3px;background:var(--or);margin-top:22px}
.slide.active .sh .rule{animation-name:grow}
@keyframes grow{from{opacity:1;width:0}to{opacity:1;width:64px}}
.s-body{flex:1;display:flex;flex-direction:column;justify-content:center;position:relative;z-index:1;padding-bottom:10px}
h3{font-weight:700;font-size:20px;line-height:1.25;margin-bottom:8px;color:#fff}
p{font-size:16px;line-height:1.62;color:#c9cad4;font-weight:400}
.lede{font-size:20px;line-height:1.6;color:#d6d7df;font-weight:300;max-width:1300px;margin-bottom:34px}
.lede.big{font-size:23px}

/* COVER / CLOSE */
.slide.dark{padding:0;background:#07080c}
.slide.dark .bg{position:absolute;inset:-4%;background-image:var(--city);background-size:cover;background-position:center}
.slide.active .kb{animation:kb 26s ease-in-out infinite alternate}
.slide.dark .veil{position:absolute;inset:0;background:linear-gradient(105deg,rgba(7,8,12,.96) 0%,rgba(7,8,12,.8) 45%,rgba(7,8,12,.35) 75%,rgba(238,106,44,.35) 100%),radial-gradient(ellipse at 100% 100%,rgba(238,106,44,.5),transparent 55%)}
.br{position:absolute;width:44px;height:44px;border:0 solid var(--or);z-index:3;transition:all 1.2s var(--ease) .3s;opacity:0}
.br.tl{top:44px;left:44px;border-top-width:3px;border-left-width:3px;transform:translate(-20px,-20px)}
.br.tr{top:44px;right:44px;border-top-width:3px;border-right-width:3px;transform:translate(20px,-20px)}
.br.bl{bottom:44px;left:44px;border-bottom-width:3px;border-left-width:3px;transform:translate(-20px,20px)}
.br.brr{bottom:44px;right:44px;border-bottom-width:3px;border-right-width:3px;transform:translate(20px,20px)}
.slide.active .br{opacity:1;transform:none}
.logo-cover{position:absolute;top:96px;left:116px;height:40px;z-index:3}
.cover-body,.close-body{position:absolute;left:116px;right:116px;z-index:3}
.cover-body{bottom:178px}
.eyebrow{font-size:14px;font-weight:800;letter-spacing:.34em;display:flex;align-items:center;gap:20px;margin-bottom:22px;color:#fff}
.eyebrow .dash{width:46px;height:3px;background:var(--or)}
.cover-title{font-family:var(--disp);font-weight:400;font-size:148px;line-height:.86;letter-spacing:.005em}
.accent{color:var(--or)}
.cover-sub{font-size:24px;font-weight:300;color:#e4e4ea;margin-top:34px}
.cover-meta{font-size:13px;font-weight:800;letter-spacing:.24em;color:var(--or);margin-top:22px}
.hint{position:absolute;right:116px;bottom:104px;z-index:3;font-size:12px;letter-spacing:.12em;color:rgba(255,255,255,.55)}
.slide.active .hint{animation-delay:2.2s!important}
.dark>.chrome-foot{left:116px;right:116px;bottom:50px;z-index:3;border-color:rgba(255,255,255,.18);color:rgba(255,255,255,.65)}
.dark>.chrome-logo{display:none}

.close-body{top:210px}
.close-title{font-family:var(--disp);font-weight:400;font-size:86px;line-height:.95}
.close-cols{display:grid;grid-template-columns:1.15fr 1fr;gap:80px;margin-top:44px}
.close-cols .cl>p{font-size:20px;line-height:1.65;color:#dadbe2;font-weight:300}
.sig{margin-top:34px;padding-top:28px;border-top:1px solid rgba(255,255,255,.2)}
.sname{font-family:var(--disp);font-size:40px;letter-spacing:.02em;text-transform:uppercase}
.srole{font-size:12px;font-weight:800;letter-spacing:.28em;color:var(--or);margin:4px 0 12px}
.smail,.smail a{font-size:15px;color:#c9cad4;text-decoration:none}
.smail a:hover{color:var(--or)}
.cr{border-left:3px solid var(--or);padding:6px 0 6px 36px;align-self:start}
.cr .lbl{margin-bottom:18px}
.q{font-size:23px!important;line-height:1.45!important;color:#fff!important;margin-bottom:22px;display:flex;gap:16px}
.q span{flex:none;font-family:var(--disp);color:var(--or);font-size:34px;line-height:1}

/* 02 story */
.story{display:grid;grid-template-columns:360px 1fr;gap:52px;align-items:center;flex-direction:row}
.photo{height:560px;position:relative;overflow:hidden;border-left:4px solid var(--or)}
.photo img{width:100%;height:100%;object-fit:cover;filter:saturate(.85) contrast(1.05);transition:transform 6s ease}
.slide.active .photo img{transform:scale(1.06)}
.photo:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 55%,rgba(13,14,22,.6))}
.iblocks{display:flex;flex-direction:column;gap:16px}
.iblock{display:grid;grid-template-columns:64px 1fr;gap:26px;background:var(--card);border:1px solid var(--line);border-left:4px solid var(--or);padding:28px 34px;transition:transform .35s var(--ease),background .35s}
.iblock:hover{transform:translateX(6px);background:var(--card2)}
.itile{width:58px;height:58px;border-radius:12px;background:var(--orD);display:grid;place-items:center}
.itile img{width:34px;height:34px}
.iblock .lbl{margin-bottom:8px}
.iblock p{font-size:16.5px}

/* 03 grid */
.grid3x2{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.xcard{position:relative;background:var(--card);border:1px solid var(--line);padding:34px 34px 38px;min-height:232px;overflow:hidden;transition:transform .4s var(--ease),border-color .4s}
.xcard:before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--or);transform-origin:top;transition:width .45s var(--ease)}
.xcard:hover{transform:translateY(-6px);border-color:rgba(238,106,44,.4)}
.xcard:hover:before{width:100%;opacity:.08}
.xn{position:absolute;right:22px;top:12px;font-family:var(--disp);font-size:64px;color:rgba(255,255,255,.05);transition:color .4s}
.xcard:hover .xn{color:rgba(238,106,44,.35)}
.xcard p{font-size:15.5px}

/* 04 panels */
.panels3{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.panel{background:var(--card);border:1px solid var(--line);border-top:3px solid var(--or);padding:30px 34px 34px}
.panel .lbl{margin-bottom:10px}
.panel h3{font-size:21px;margin-bottom:18px}
ul.dia{list-style:none}
ul.dia li{position:relative;padding-left:26px;margin-bottom:12px;font-size:16px;line-height:1.5;color:#c9cad4}
ul.dia li:before{content:"";position:absolute;left:3px;top:8px;width:7px;height:7px;background:var(--or);transform:rotate(45deg)}
.minis{display:flex;gap:30px;margin:-4px 0 18px;padding-bottom:16px;border-bottom:1px solid var(--line)}
.minis b{font-family:var(--disp);font-weight:400;font-size:54px;color:var(--or);line-height:1;display:block}
.minis span{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--mu);font-weight:600}

/* 05 pillars */
.pillars{display:grid;grid-template-columns:repeat(3,1fr);gap:0;border:1px solid var(--line);background:var(--card)}
.pillar{padding:34px 38px 38px;position:relative}
.pillar+.pillar{border-left:1px solid var(--line)}
.pillar:after{content:"";position:absolute;left:0;top:0;height:3px;width:0;background:var(--or);transition:width 1s var(--ease)}
.slide.active .pillar.shown:after{width:100%;transition-delay:.35s}
.pn{font-family:var(--disp);font-size:44px;color:var(--or);display:block;line-height:1;margin-bottom:12px}
.note{margin-top:26px;background:linear-gradient(90deg,rgba(238,106,44,.16),rgba(238,106,44,.04));border-left:4px solid var(--or);padding:22px 30px;font-size:17px;color:#e6e6ec;line-height:1.6}
.note .lbl{margin-bottom:8px}
.chips{display:inline-flex;gap:10px;flex-wrap:wrap;margin-left:6px;vertical-align:middle}
.chips span{border:1px solid rgba(238,106,44,.55);color:#fff;font-size:13.5px;font-weight:600;padding:5px 14px;border-radius:999px;background:rgba(238,106,44,.12)}

/* 06 metrics */
.metrics{display:grid;grid-template-columns:1fr 1fr 1fr;gap:20px}
.metric{background:linear-gradient(160deg,#1b1c27,#111219);border:1px solid var(--line);border-top:3px solid var(--or);padding:34px 36px 38px;position:relative;overflow:hidden}
.metric:before{content:"";position:absolute;right:-90px;top:-90px;width:260px;height:260px;border-radius:50%;background:radial-gradient(circle,rgba(238,106,44,.25),transparent 70%)}
.mbig{font-family:var(--disp);font-size:120px;line-height:.9;color:var(--or);display:flex;align-items:baseline;position:relative}
.mbig .tilde{font-size:.6em;margin-right:6px;align-self:center;transform:translateY(-6px)}
.mbig .unit{font-size:.62em;margin-left:12px}
.ring-wrap .unit{margin-left:2px}
.ring{position:absolute;right:0;top:-6px;width:112px;height:112px;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:9}
.ring .rt{stroke:rgba(255,255,255,.08)}
.ring .rf{stroke:var(--or);stroke-linecap:round;stroke-dasharray:326.7;stroke-dashoffset:326.7;transition:stroke-dashoffset 1.8s var(--ease) .25s}
.slide.active .shown .ring .rf{stroke-dashoffset:calc(326.7 * (1 - var(--p)))}
.mlbl{font-size:13px;font-weight:800;letter-spacing:.2em;margin:18px 0 18px;color:#fff}
.metric p{font-size:15.5px}
.metric .m2{margin-top:12px;color:var(--mu)}
.metric.light{background:var(--card);border-top-color:var(--or)}
.metric.light:before{display:none}
.metric.light .lbl{margin:6px 0 10px}
.metric.light h3{font-size:24px;margin-bottom:16px}
.foot{margin-top:24px;padding-top:20px;border-top:1px solid var(--line);font-style:italic;color:var(--mu)!important;font-size:14.5px!important;display:flex;gap:12px;align-items:flex-start}
.pulse{flex:none;width:10px;height:10px;border-radius:50%;background:var(--or);margin-top:7px;box-shadow:0 0 0 0 rgba(238,106,44,.6);animation:pulse 2s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 12px rgba(238,106,44,0)}100%{box-shadow:0 0 0 0 rgba(238,106,44,0)}}

/* 07 flows */
.flow-head,.flow{display:grid;grid-template-columns:1.05fr 40px 1fr 40px 1fr;align-items:stretch}
.flow-head{font-size:11.5px;font-weight:800;letter-spacing:.26em;color:var(--or);margin-bottom:12px}
.flow-head span:nth-child(1){grid-column:1}.flow-head span:nth-child(2){grid-column:3}.flow-head span:nth-child(3){grid-column:5}
.flows{display:flex;flex-direction:column;gap:14px}
.flow>div{padding:24px 28px;font-size:16px;line-height:1.55;color:#cfd0d9;display:flex;flex-direction:column;justify-content:center}
.f1{background:linear-gradient(90deg,var(--or),#d9561c);color:#fff!important}
.f1 h3{margin-bottom:4px}
.f1 p{color:rgba(255,255,255,.88);font-size:15px}
.f2{background:var(--card);border:1px solid var(--line)}
.f3{background:var(--card2);border:1px solid var(--line);border-right:3px solid var(--or);color:#fff!important;font-weight:500}
.arr{position:relative}
.arr:before{content:"";position:absolute;top:50%;left:8px;right:12px;height:2px;background:rgba(238,106,44,.6)}
.arr:after{content:"";position:absolute;top:50%;right:10px;width:9px;height:9px;border-top:2px solid var(--or);border-right:2px solid var(--or);transform:translateY(-50%) rotate(45deg)}
.slide.active .arr.shown:before{animation:dash .9s var(--ease) both}
@keyframes dash{from{transform:scaleX(0);transform-origin:left}to{transform:scaleX(1);transform-origin:left}}

/* 08 opps */
.opps{display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:auto auto 1fr;column-gap:20px}
.opp{background:var(--card);border:1px solid var(--line);display:grid;grid-row:span 3;grid-template-rows:subgrid;row-gap:0;transition:transform .4s var(--ease),box-shadow .4s}
.opp:hover{transform:translateY(-6px);box-shadow:0 24px 50px rgba(0,0,0,.45),0 0 0 1px rgba(238,106,44,.35)}
.otop{background:linear-gradient(135deg,var(--or),#c84f17);padding:26px 30px 24px;position:relative}
.otop .on{position:absolute;right:20px;top:8px;font-family:var(--disp);font-size:60px;color:rgba(255,255,255,.22)}
.otop h3{font-size:21px;max-width:82%}
.otop p{color:rgba(255,255,255,.9);font-size:14.5px;line-height:1.5}
.osec{padding:22px 30px 4px}
.osec .lbl{margin-bottom:6px;font-size:10.5px}
.osec p{font-size:15px}
.osec.val{padding-bottom:26px;border-top:1px solid var(--line);margin-top:16px;padding-top:20px}
.osec.val p{color:#fff}
.big-val{font-family:var(--disp);font-size:58px;color:var(--or);line-height:1;margin-top:12px}
.big-val small{display:block;font-family:var(--body);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--mu);margin-top:4px}
.fn{font-size:13px;font-style:italic;color:var(--mu2);margin-top:16px}

/* 09 matrix */
table.mx{width:100%;border-collapse:separate;border-spacing:0 10px}
.mx th{text-align:left;font-size:11.5px;font-weight:800;letter-spacing:.26em;color:var(--or);padding:0 30px 0}
.mx td{background:var(--card);padding:26px 30px;font-size:16px;line-height:1.55;color:#cfd0d9;vertical-align:middle;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.mx td:last-child{border-right:1px solid var(--line);color:#fff}
.mx td.lead{width:30%;background:linear-gradient(90deg,rgba(238,106,44,.22),rgba(238,106,44,.06));border-left:4px solid var(--or);font-weight:700;font-size:19px;color:#fff;white-space:nowrap}
.mx tr{transition:transform .3s var(--ease)}
.mx tbody tr:hover{transform:translateX(6px)}
.mx .sdot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--or);margin-right:14px;vertical-align:middle;animation:pulse 2.4s infinite}

/* 10 sector */
.goal{display:flex;align-items:center;gap:36px;margin:6px 0 22px}
.goal-num{font-family:var(--disp);font-size:84px;line-height:.85;color:var(--or);display:flex;align-items:baseline;flex:none}
.goal-num span:first-child,.goal-num span:last-child{font-size:.7em}
.goal p{font-size:20px;font-weight:300;color:#d6d7df;max-width:780px;border-left:1px solid var(--line);padding-left:36px}
.goal p b{color:#fff;font-weight:600}
.pairs{display:flex;flex-direction:column;gap:12px}
.pair{display:grid;grid-template-columns:420px 1fr;background:var(--card);border:1px solid var(--line)}
.pl{padding:22px 30px;border-right:1px solid var(--line);position:relative}
.pl:before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--or)}
.pl h3{font-size:19px;margin:6px 0 4px}
.pl p{font-size:14.5px;color:var(--mu)}
.pr{padding:22px 32px;display:flex;flex-direction:column;justify-content:center}
.pr .lbl{color:var(--mu2);margin-bottom:6px;font-size:10.5px}
.pr p{font-size:15.5px}
.pr .hl{margin-top:10px;color:var(--or);font-weight:700;font-size:15.5px}

/* 11 stepper */
.stepper{position:relative}
.steps{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;position:relative;padding-bottom:28px}
.step{display:flex;flex-direction:column;justify-content:flex-start;align-items:flex-start;text-align:left;padding:22px 22px 20px;background:var(--card);border:1px solid var(--line);position:relative;transition:all .4s var(--ease);min-height:126px}
.step b{display:block;font-family:var(--disp);font-weight:400;font-size:42px;line-height:1;color:var(--mu2);transition:color .4s}
.step span{display:block;font-weight:700;font-size:16.5px;line-height:1.3;margin-top:8px;color:#b9bac6;transition:color .4s}
.step:hover{border-color:rgba(238,106,44,.45)}
.step.on{background:linear-gradient(160deg,var(--or),#cf5419);border-color:var(--or);transform:translateY(-6px);box-shadow:0 18px 40px rgba(238,106,44,.25)}
.step.on b{color:rgba(255,255,255,.55)}.step.on span{color:#fff}
.step.done b{color:var(--or)}
.track{position:absolute;left:0;right:0;bottom:6px;height:3px;background:rgba(255,255,255,.08)}
.track .fill{height:100%;width:20%;background:var(--or);transition:width .6s var(--ease)}
.panes{position:relative;height:230px;margin-top:14px}
.pane{position:absolute;inset:0;display:grid;grid-template-columns:1.25fr 1fr;opacity:0;transform:translateY(16px);pointer-events:none;transition:opacity .45s var(--ease),transform .55s var(--ease)}
.pane.on{opacity:1;transform:none;pointer-events:auto}
.pcol{padding:36px 44px;background:var(--card);border:1px solid var(--line)}
.pcol .lbl{margin-bottom:14px}
.pcol p{font-size:21px;line-height:1.55;color:#e4e5ec;font-weight:300}
.pcol.ben{background:linear-gradient(135deg,rgba(238,106,44,.2),rgba(238,106,44,.05));border-color:rgba(238,106,44,.3);border-left:0}
.pcol.ben p{color:#fff;font-weight:400}
.step-hint{margin-top:18px;font-size:12px;letter-spacing:.1em;color:var(--mu2)}

/* ---------- UI chrome ---------- */
#progress{position:fixed;left:0;top:0;height:3px;background:var(--or);z-index:20;transition:width .7s var(--ease);box-shadow:0 0 12px rgba(238,106,44,.7)}
#nav{position:fixed;left:50%;bottom:16px;transform:translate(-50%,8px);z-index:20;display:flex;align-items:center;gap:6px;opacity:0;transition:opacity .35s,transform .35s;padding:6px;background:rgba(10,11,17,.72);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.1);border-radius:999px}
#nav:hover,body.ui #nav{opacity:1;transform:translate(-50%,0)}
#nav button.ic{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;transition:all .2s;color:#cfd0d9}
#nav .sep{width:1px;height:20px;background:rgba(255,255,255,.14);margin:0 4px}
#nav button.ic:hover{background:rgba(238,106,44,.18);color:var(--or)}
#nav button svg{width:18px;height:18px}
#nav .cnt{font-size:12px;font-weight:700;letter-spacing:.12em;min-width:64px;text-align:center;color:var(--mu)}
#nav .cnt b{color:#fff}
#dots{display:flex;gap:7px;padding:0 6px}
#dots button{width:8px;height:8px;flex:none;border-radius:50%;background:rgba(255,255,255,.25);transition:all .3s}
#dots button.on{background:var(--or);width:26px;border-radius:5px}
#help{position:fixed;inset:0;z-index:40;display:grid;place-items:center;background:rgba(5,6,10,.75);backdrop-filter:blur(6px);opacity:0;pointer-events:none;transition:opacity .3s}
#help.on{opacity:1;pointer-events:auto}
#help .hb{background:var(--card);border:1px solid var(--line);border-top:3px solid var(--or);padding:34px 40px;min-width:360px}
#help h4{font-family:var(--disp);font-weight:400;font-size:34px;margin-bottom:16px}
#help li{list-style:none;display:flex;justify-content:space-between;gap:40px;font-size:14px;padding:8px 0;border-bottom:1px solid var(--line);color:var(--mu)}
#help li span{color:#fff}

/* overview */
#viewport.ov{overflow-y:auto;display:block;padding:70px 40px}
#viewport.ov #stage{transform:none!important;width:auto;height:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:24px;max-width:1500px;margin:0 auto}
#viewport.ov .ovcell{position:relative;aspect-ratio:16/9;overflow:hidden;cursor:pointer;border:1px solid var(--line);transition:transform .3s var(--ease),border-color .3s}
#viewport.ov .ovcell:hover{transform:translateY(-4px);border-color:var(--or)}
#viewport.ov .ovcell.cur{outline:2px solid var(--or);outline-offset:3px}
#viewport.ov .slide{visibility:visible;opacity:1;filter:none;transform:scale(var(--ovs,.2));transform-origin:0 0;width:1600px;height:900px;transition:none;pointer-events:none}
#viewport.ov .slide [data-a],#viewport.ov .slide [data-step]{opacity:1!important;animation:none!important}
#viewport.ov .ring .rf{stroke-dashoffset:calc(326.7 * (1 - var(--p)))}
#viewport.ov .pillar:after{width:100%}
#viewport.ov .ovlbl{position:absolute;left:0;right:0;bottom:0;padding:8px 12px;font-size:11px;letter-spacing:.12em;background:linear-gradient(transparent,rgba(0,0,0,.85));z-index:5;color:#fff}
#viewport.ov .ovlbl b{color:var(--or);margin-right:8px}
body.ovm #nav{display:none}

@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;transition-duration:.01s!important}}
</style>
</head>

    return new Uint8Array(await crypto.subtle.deriveBits({name:'PBKDF2',salt,iterations:iter,hash:'SHA-256'},k,len*8))}}catch(e){}
  return pbkdf2JS(pw,salt,iter,len)}
const enc8=s=>{try{return new TextEncoder().encode(s)}catch(e){return Uint8Array.from(unescape(encodeURIComponent(s)),c=>c.charCodeAt(0))}};
const dec8=b=>{try{return new TextDecoder().decode(b)}catch(e){let s='';for(let i=0;i<b.length;i+=8192)s+=String.fromCharCode.apply(null,b.subarray(i,i+8192));return decodeURIComponent(escape(s))}};
const BAD='BAD_PASSWORD';
async function decrypt(pw){
  const salt=b64(PAYLOAD.salt),iv=b64(PAYLOAD.iv),ct=b64(PAYLOAD.ct),tag=b64(PAYLOAD.tag);
  const km=await pbkdf2(enc8(pw),salt,PAYLOAD.iter,64),ek=km.subarray(0,32),mk=km.subarray(32);
  const t=hmac(mk,cat(iv,ct));let d=0;for(let i=0;i<32;i++)d|=t[i]^tag[i];
  if(d)throw new Error(BAD);
  const pt=new Uint8Array(ct.length),blk=new Uint8Array(32+iv.length+4);blk.set(ek);blk.set(iv,32);
  const dv=new DataView(blk.buffer);
  for(let i=0,c=0;i<ct.length;i+=32,c++){dv.setUint32(32+iv.length,c);const ks=sha256(blk);
    for(let j=0;j<32&&i+j<ct.length;j++)pt[i+j]=ct[i+j]^ks[j]}
  return dec8(pt)}
const norm=s=>(s||'').trim().toLowerCase();
const gate=document.getElementById('gate'),msg=document.getElementById('gmsg'),pwEl=document.getElementById('pw');
let busy=false;
async function unlock(pw,silent){
  if(busy)return;busy=true;
  if(!silent){msg.textContent='Unlocking…';msg.className='gmsg'}
  let html;
  try{html=await decrypt(norm(pw))}
  catch(e){busy=false;if(silent)return;
    if(e&&e.message===BAD){msg.textContent='Incorrect password. Please try again.'}
    else{msg.textContent='Could not unlock in this browser ('+(e&&e.message||e)+').'}
    msg.className='gmsg err';gate.classList.remove('shake');void gate.offsetWidth;gate.classList.add('shake');pwEl.select();return}
  try{sessionStorage.setItem('pa_pw',pw)}catch(e){}
  try{start(html)}catch(e){busy=false;msg.textContent='Unlocked, but the deck failed to start ('+e.message+').';msg.className='gmsg err'}
}
document.getElementById('gform').addEventListener('submit',e=>{e.preventDefault()});
document.getElementById('gbtn').addEventListener('click',e=>{e.preventDefault();unlock(pwEl.value)});
pwEl.addEventListener('keydown',e=>{e.stopPropagation();if(e.key==='Enter'||e.keyCode===13){e.preventDefault();unlock(pwEl.value)}});
try{const s=sessionStorage.getItem('pa_pw');if(s)unlock(s,true)}catch(e){}

/* ---------- deck ---------- */
let slides=[],cur=0,ov=false;
const stage=document.getElementById('stage'),vp=document.getElementById('viewport');
function start(html){
  stage.innerHTML=html;
  slides=[...stage.querySelectorAll('.slide')];
  const N=slides.length;
  slides.forEach((s,i)=>{
    if(!s.classList.contains('dark')){const l=document.createElement('img');l.className='chrome-logo';l.src=LOGO;l.alt='';s.appendChild(l)}
    const f=document.createElement('div');f.className='chrome-foot';
    f.innerHTML='<span>CONFIDENTIAL &nbsp;|&nbsp; OREGON LOTTERY + PLAN A TECHNOLOGIES</span><b>'+String(i+1).padStart(2,'0')+'</b>';
    s.appendChild(f);
    s.querySelectorAll('[data-a]').forEach((el,k)=>el.style.setProperty('--i',k));
  });
  const dots=document.getElementById('dots');
  slides.forEach((s,i)=>{const b=document.createElement('button');b.title=s.dataset.title;b.onclick=e=>{e.stopPropagation();go(i)};dots.appendChild(b)});
  initStepper();
  initBuilds();
  gate.classList.add('out');
  setTimeout(()=>{gate.remove()},1000);
  document.getElementById('app').classList.add('on');
  fit();
  let h=NaN;try{h=parseInt(location.hash.replace('#',''),10)}catch(e){}
  go(h>=1&&h<=N?h-1:0,true);
}
function fit(){
  if(ov)return;
  const s=Math.min(innerWidth/1600,innerHeight/900);
  stage.style.transform='scale('+s+')';
}
addEventListener('resize',()=>{fit();if(ov)ovScale()});

function go(i,first,back){
  if(!slides.length)return;
  i=Math.max(0,Math.min(slides.length-1,i));
  slides.forEach((s,k)=>{s.classList.toggle('past',k<i);s.classList.remove('active')});
  // force restart of reveal animations
  void stage.offsetWidth;
  slides[i].classList.add('active');
  cur=i;
  document.getElementById('progress').style.width=((i+1)/slides.length*100)+'%';
  document.querySelectorAll('#dots button').forEach((b,k)=>b.classList.toggle('on',k===i));
  try{history.replaceState(null,'','#'+(i+1))}catch(e){/* sandboxed preview: URL can't change, deck still works */}
  runCounters(slides[i],700,true);
  setBuild(back?(slides[i]._nb||0):0);
  if(slides[i].querySelector('.stepper'))setStep(back?99:0);
}
function runCounters(s,delay,skipBuilds){
  s.querySelectorAll('.count').forEach(el=>{
    if(skipBuilds&&el.closest('[data-step]'))return;
    const to=parseFloat(el.dataset.to),dec=+(el.dataset.dec||0),suf=el.dataset.suffix||'';
    const t0=performance.now()+(delay==null?700:delay),d=1700,tok=el._tok=(el._tok||0)+1;
    const fin=to.toFixed(dec)+suf;el.textContent=(0).toFixed(dec)+suf;setTimeout(()=>{if(el._tok===tok)el.textContent=fin},t0-performance.now()+d+300);
    const tick=t=>{if(el._tok!==tok)return;const p=Math.min(1,Math.max(0,(t-t0)/d)),e=1-Math.pow(1-p,4);el.textContent=(to*e).toFixed(dec)+suf;if(p<1)requestAnimationFrame(tick)};
    requestAnimationFrame(tick);
  });
}
/* stepper on slide 11 */
let step=0;
function setStep(k){
  const st=stage.querySelector('.stepper');if(!st)return;
  const n=st.querySelectorAll('.step').length;
  step=Math.max(0,Math.min(n-1,k));
  st.querySelectorAll('.step').forEach((b,j)=>{b.classList.toggle('on',j===step);b.classList.toggle('done',j<step)});
  st.querySelectorAll('.pane').forEach((p,j)=>p.classList.toggle('on',j===step));
  st.querySelector('.fill').style.width=((step+1)/n*100)+'%';
}
function initStepper(){
  stage.querySelectorAll('.step').forEach(b=>b.addEventListener('click',e=>{e.stopPropagation();setStep(+b.dataset.k)}));
}
const onStepper=()=>slides[cur]&&slides[cur].querySelector('.stepper');
/* next/prev step through the priority tabs on slide 11 before leaving it */
function stepCount(){const s=onStepper();return s?s.querySelectorAll('.step').length:0}
/* click builds: number the [data-step] groups on each slide.
   data-step="" = next group, "+" = joins the following element's group, "N" = group N */
let build=0;
function initBuilds(){
  slides.forEach(s=>{let g=0,wait=[];
    s.querySelectorAll('[data-step]').forEach(el=>{const v=el.getAttribute('data-step');
      if(v==='+'){wait.push(el);return}
      if(/^\d+$/.test(v)){el._g=+v;return}
      g++;el._g=g;wait.forEach(w=>w._g=g);wait=[]});
    wait.forEach(w=>w._g=g);s._nb=g});
}
function setBuild(n){
  const s=slides[cur];if(!s)return;
  build=Math.max(0,Math.min(s._nb||0,n));
  s.querySelectorAll('[data-step]').forEach(el=>{const on=el._g<=build;
    if(on&&!el.classList.contains('shown')){el.classList.add('shown');runCounters(el,150)}
    else if(!on)el.classList.remove('shown')});
}
function next(){const s=slides[cur];if(s&&build<(s._nb||0)){setBuild(build+1);return}
  const n=stepCount();if(n&&step<n-1){setStep(step+1);return}go(cur+1)}
function prev(){if(build>0){setBuild(build-1);return}
  const n=stepCount();if(n&&step>0){setStep(step-1);return}if(cur>0)go(cur-1,false,true)}

/* overview */
function ovScale(){
  const c=stage.querySelector('.ovcell');if(!c)return;
  stage.style.setProperty('--ovs',c.clientWidth/1600);
  stage.querySelectorAll('.slide').forEach(s=>s.style.setProperty('--ovs',c.clientWidth/1600));
}
function toggleOv(){
  if(!slides.length)return;
  ov=!ov;document.body.classList.toggle('ovm',ov);vp.classList.toggle('ov',ov);
  if(ov){
    slides.forEach((s,i)=>{const c=document.createElement('div');c.className='ovcell'+(i===cur?' cur':'');
      c.innerHTML='<div class="ovlbl"><b>'+String(i+1).padStart(2,'0')+'</b>'+s.dataset.title.toUpperCase()+'</div>';
      s.parentNode.insertBefore(c,s);c.appendChild(s);c.onclick=e=>{e.stopPropagation();toggleOv();go(i)}});
    ovScale();
  }else{
    stage.querySelectorAll('.ovcell').forEach(c=>{const s=c.querySelector('.slide');stage.insertBefore(s,c);c.remove()});
    fit();go(cur);
  }
}
function fs(){try{const d=document.documentElement;const p=!document.fullscreenElement?(d.requestFullscreen&&d.requestFullscreen()):document.exitFullscreen();if(p&&p.catch)p.catch(()=>{})}catch(e){}}

document.getElementById('bNext').onclick=e=>{e.stopPropagation();next()};
document.getElementById('bPrev').onclick=e=>{e.stopPropagation();prev()};
document.getElementById('bOv').onclick=e=>{e.stopPropagation();toggleOv()};
document.getElementById('bFs').onclick=e=>{e.stopPropagation();fs()};
const help=document.getElementById('help');
document.getElementById('bHelp').onclick=e=>{e.stopPropagation();help.classList.add('on')};help.onclick=e=>{e.stopPropagation();help.classList.remove('on')};

addEventListener('keydown',e=>{
  if(!slides.length||e.metaKey||e.ctrlKey||e.altKey)return;
  if(e.target&&e.target.closest&&e.target.closest('input,textarea'))return;
  const k=e.key;
  if(help.classList.contains('on')&&k!=='?'){help.classList.remove('on');return}
  if(ov){if(k==='Escape'||k==='o'||k==='O')toggleOv();return}
  if(['ArrowRight','PageDown',' ','Enter'].includes(k)){e.preventDefault();next()}
  else if(['ArrowLeft','PageUp','Backspace'].includes(k)){e.preventDefault();prev()}
  else if(k==='ArrowDown'&&onStepper()){e.preventDefault();setStep(step+1)}
  else if(k==='ArrowUp'&&onStepper()){e.preventDefault();setStep(step-1)}
  else if(k==='Home')go(0);else if(k==='End')go(slides.length-1);
  else if(k==='o'||k==='O'||k==='Escape')toggleOv();
  else if(k==='f'||k==='F')fs();
  else if(k==='?')help.classList.toggle('on');
});
/* click to advance (ignore links, buttons, interactive cards) */
vp.addEventListener('click',e=>{
  if(ov||!slides.length)return;
  if(e.target.closest('a,button,input,#nav'))return;
  if(getSelection().toString())return;
  (e.clientX<innerWidth*0.25)?prev():next();
});
/* swipe */
let tx=null,ty=null;
addEventListener('touchstart',e=>{tx=e.touches[0].clientX;ty=e.touches[0].clientY},{passive:true});
addEventListener('touchend',e=>{if(tx===null||ov)return;const dx=e.changedTouches[0].clientX-tx,dy=e.changedTouches[0].clientY-ty;
  if(Math.abs(dx)>50&&Math.abs(dx)>Math.abs(dy))dx<0?next():prev();tx=null},{passive:true});
/* show UI on mouse move */
let uiT;addEventListener('mousemove',()=>{document.body.classList.add('ui');clearTimeout(uiT);uiT=setTimeout(()=>document.body.classList.remove('ui'),2200)});
</script>
</body>
